<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mahjong Solitaire — free</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: .5rem;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at 50% 40%, #1f5a46, #0d2a20 75%); color: #eef4ef;
    display: flex; flex-direction: column; gap: .4rem;
  }
  .bar { display: flex; gap: .45rem; flex-wrap: wrap; justify-content: center; align-items: center; font-size: .9rem; }
  .bar b { font-variant-numeric: tabular-nums; }
  #stage { flex: 1 1 auto; position: relative; min-height: 260px; }
  #field { position: absolute; left: 50%; top: 50%; }
  .tile {
    position: absolute; padding: 0; border: 0; cursor: pointer;
    background: linear-gradient(135deg, #fffdf7, #ece4d2);
    border: 1px solid #c9b993;
    border-radius: 10% / 8%;
    /* The tile's thickness, then its shadow on whatever is below. */
    box-shadow: calc(var(--dx) * .5) calc(var(--dx) * .5) 0 #d8c9a3, var(--dx) var(--dx) 0 #9c8458,
      calc(var(--dx) * 1.5) calc(var(--dx) * 1.7) calc(var(--dx) * 1.4) rgba(0,0,0,.5);
    transition: filter .12s, transform .12s;
  }
  .tile img { width: 86%; height: 88%; margin: 6% 7%; display: block; pointer-events: none; }
  .tile.blocked { filter: brightness(.74) saturate(.8); cursor: default; }
  .tile.sel { filter: brightness(1.05) sepia(.6) saturate(2.2) hue-rotate(-12deg); transform: translateY(-3%); }
  .tile.hint { animation: pulse .7s ease-in-out 3; }
  .tile.gone { opacity: 0; transform: scale(.6); pointer-events: none; transition: opacity .25s, transform .25s; }
  @keyframes pulse { 50% { filter: brightness(1.3) drop-shadow(0 0 6px #ffe680); } }
  @media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile.hint { animation: none; outline: 3px solid #ffe680; } }
  #status { text-align: center; min-height: 1.4em; margin: 0; font-size: .95rem; }
  .button, select {
    font: inherit; font-size: .88rem; padding: .38rem .75rem;
    border-radius: 8px; border: 1px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.25); color: inherit; cursor: pointer;
  }
  .button.primary { background: #c0392b; border-color: #c0392b; color: #fff; font-weight: 600; }
  select option { color: #111; }
  .button:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
  <div class="bar">
    <span>Pairs left <b id="left">68</b></span>
    <span>Moves available <b id="avail">–</b></span>
    <span>Time <b id="time">0:00</b></span>
  </div>
  <div id="stage"><div id="field" aria-label="Mahjong tiles"></div></div>
  <p id="status" aria-live="polite"></p>
  <div class="bar">
    <label>Layout
      <select id="layout">
        <option value="turtle">Turtle</option>
        <option value="pyramid">Pyramid</option>
        <option value="bridge">Bridge</option>
        <option value="fortress">Fortress</option>
      </select>
    </label>
    <button class="button" id="hint">Hint</button>
    <button class="button" id="undo">Undo</button>
    <button class="button" id="shuffle">Shuffle</button>
    <button class="button primary" id="new">New game</button>
  </div>
<script src="/apps/gamesave.js?v=1"></script>
<script src="mahjong.js?v=1"></script>
</body>
</html>
