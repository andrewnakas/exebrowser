[scummvm]
# ScummVM fetches this file on first run and copies it into its IDBFS home
# directory (backends/fs/emscripten/emscripten-fs-factory.cpp). It MUST exist:
# if the request 404s, Cloudflare Pages' SPA fallback answers with the site's
# homepage HTML and a 200 status, ScummVM sees response.ok, and writes that
# HTML into scummvm.ini. The parser then rejects it and blocks at startup on a
# "Bad config file format. overwrite?" dialog over a black screen -- which is
# indistinguishable from the game simply never loading.
#
# Comments here MUST start with '#'. ScummVM's parser (common/config-manager.cpp)
# treats ';' lines as key=value pairs, fails to find '=', and rejects the whole
# file -- producing that same blocking dialog.
#
# audio_buffer_size is the reason this file carries settings at all. The SDL
# mixer otherwise sizes its buffer to ~45ms (backends/mixer/sdl/sdl-mixer.cpp),
# which is far too tight here: the Emscripten backend's delayMillis() yields
# through ASYNCIFY, so the main thread stalls for longer than a 45ms buffer can
# cover and the audio underruns. A larger buffer trades latency we don't care
# about in a point-and-click adventure for playback that doesn't break up.
audio_buffer_size=4096
music_driver=auto
subtitles=true
speech_volume=192
music_volume=160
sfx_volume=192
filtering=false
aspect_ratio=false
fullscreen=false
