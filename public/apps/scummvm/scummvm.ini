[scummvm]
; ScummVM fetches this file on first run and copies it into its IDBFS home
; directory (backends/fs/emscripten/emscripten-fs-factory.cpp). It MUST exist:
; if the request 404s, Cloudflare Pages' SPA fallback answers with the site's
; homepage HTML and a 200 status, ScummVM sees response.ok, and writes that
; HTML into scummvm.ini — a corrupt config that then persists in IndexedDB
; across every later visit.
;
; audio_buffer_size is the reason this file carries settings at all. The SDL
; mixer otherwise sizes its buffer to ~45ms (sdl-mixer.cpp), which is far too
; tight here: the Emscripten backend's delayMillis() yields through ASYNCIFY,
; so the main thread stalls for much longer than a 45ms buffer can cover and
; the audio underruns. A larger buffer trades latency we don't care about in
; a point-and-click adventure for playback that doesn't break up.
audio_buffer_size=4096
music_driver=auto
subtitles=true
speech_volume=192
music_volume=160
sfx_volume=192
gfx_mode=surfacesdl
filtering=false
aspect_ratio=false
fullscreen=false
