<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperTux</title>
<meta name="robots" content="noindex">
<!-- Written for exebrowser.com (GPL-3.0-or-later). SuperTux needs a page of
     its own (it uses threads, which browsers only allow on an isolated
     top-level page), so the frame on /run/supertux/ shows this launcher and
     the link below replaces the whole tab. -->
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #0b2a4a url("supertux2_bkg.png") center / cover no-repeat; font: 600 18px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #fff; text-decoration: none; background: rgba(4, 18, 36, .45); }
  img { width: min(46vw, 260px); height: auto; }
  .go { padding: 14px 30px; border-radius: 10px; background: #c0392b; box-shadow: 0 4px 18px rgba(0, 0, 0, .4); font-size: 22px; }
  a:hover .go, a:focus-visible .go { background: #d9483a; }
  .size { font-weight: 500; font-size: 14px; opacity: .9; }
</style>
</head>
<body>
<a href="/apps/supertux/" target="_top" rel="noopener">
  <img src="supertux2.png" alt="">
  <span class="go">▶ SuperTux</span>
  <span class="size">250 MB · WebGL</span>
</a>
</body>
</html>
