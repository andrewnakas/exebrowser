<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Extract archive — 7Z, ZIP, RAR, TAR</title>
<style>
  :root { color-scheme: dark; --bg:#0e0d0b; --card:#1a1816; --fg:#f1ece4; --muted:#9c9183;
          --accent:#b1281f; --border:#2a2622; }
  * { box-sizing: border-box; }
  body { margin:0; padding:1rem; background:var(--bg); color:var(--fg); min-height:100vh;
         font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; }
  #dropzone { border:2px dashed var(--border); border-radius:10px; padding:2rem 1rem;
              text-align:center; cursor:pointer; transition:border-color .15s, background .15s; }
  #dropzone:hover, #dropzone.hover { border-color:var(--accent); background:rgba(177,40,31,.08); }
  #dropzone p { margin:.3rem 0; }
  #dropzone .hint { color:var(--muted); font-size:.9rem; }
  input[type=file] { display:none; }
  .row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin:.85rem 0; }
  button { background:#232020; color:var(--fg); border:1px solid var(--border); border-radius:7px;
           padding:.5em 1em; font:inherit; font-weight:600; cursor:pointer; }
  button:hover:not(:disabled) { background:#2f2a25; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  input[type=text], input[type=password], input[type=search] {
    background:#0a0908; color:var(--fg); border:1px solid var(--border);
    border-radius:7px; padding:.5em .7em; font:inherit; }
  /* extractor.js emits rows as .tree-row divs of adjacent inline spans with no
     separators, so without layout they render as "readme.txt35 BSave".
     Verified against the real DOM rather than assumed: the rows are divs, not
     list items, and the Save button sits in a .row-actions span. */
  .tree-row { display:flex; align-items:center; gap:.6rem; padding:.15rem 0; }
  .tree-row .name { flex:1 1 auto; min-width:0; overflow:hidden;
                    text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .tree-row .name:hover { color:var(--accent); }
  .tree-row .size { flex:0 0 auto; color:var(--muted); font-size:.85rem;
                    font-variant-numeric:tabular-nums; }
  .tree-row .row-actions { flex:0 0 auto; }
  .row-btn { padding:.22em .7em; font-size:.82rem; font-weight:500; }
  /* The picked-file row nests name and size inside a wrapper span, so the
     flex has to go on .file-item's inner span, not on #fileList itself. */
  .file-item { display:flex; align-items:center; gap:.6rem; }
  .file-item > span { display:flex; align-items:center; gap:.5rem; min-width:0; }
  .file-item .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-item .remove { padding:.15em .55em; line-height:1; }
  #fileList:empty, #archiveMeta:empty { display:none; }
  #fileList { margin:.6rem 0; color:var(--muted); font-size:.9rem; }
  #archiveMeta { margin:.5rem 0; color:var(--muted); font-size:.88rem; }
  #tree { margin-top:.75rem; max-height:52vh; overflow:auto; border:1px solid var(--border);
          border-radius:8px; padding:.5rem; background:#111 }
  #tree:empty { display:none; }
  #tree ul { list-style:none; margin:0; padding-left:1.1rem; }
  #tree li { padding:.12rem 0; }
  #tree label { display:flex; gap:.45rem; align-items:center; cursor:pointer; }
  /* extractor.js toggles this with inline style.display ('none'/'flex'),
     so the stylesheet only sets the flex layout, never the visibility. */
  #treeToolbar { display:none; gap:.5rem; flex-wrap:wrap; align-items:center; }
  #status { margin:.7rem 0; padding:.55rem .8rem; border-left:3px solid var(--accent);
            background:#0a0908; border-radius:4px; font-size:.9rem; white-space:pre-wrap; }
  #status:empty { display:none; }
  #progressWrap { display:none; margin:.6rem 0; }
  #progressWrap.visible { display:block; }
  progress { width:100%; height:6px; }
  #previewModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:50;
                  padding:2rem 1rem; overflow:auto; }
  #previewModal.visible { display:block; }
  #previewModal .inner { max-width:900px; margin:0 auto; background:var(--card);
                         border:1px solid var(--border); border-radius:10px; padding:1rem; }
  #previewBody { max-height:70vh; overflow:auto; }
  #previewBody img, #previewBody video { max-width:100%; }
  #previewBody pre { white-space:pre-wrap; word-break:break-word; font-size:.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <div id="dropzone">
    <p><strong>Drop an archive here</strong></p>
    <p class="hint">or click to choose &middot; .7z .zip .rar .tar .gz .bz2 .xz .iso and more</p>
    <input type="file" id="fileInput" />
  </div>
  <div id="fileList"></div>

  <div class="row">
    <input type="password" id="archivePassword" placeholder="Password (if needed)" autocomplete="off" />
    <button type="button" id="openBtn" class="primary" disabled>Open archive</button>
    <button type="button" id="resetBtn" disabled>Reset</button>
  </div>

  <div id="status"></div>
  <div id="progressWrap"><progress id="progressBar" max="100" value="0"></progress></div>
  <div id="archiveMeta"></div>

  <div class="row" id="treeToolbar">
    <label><input type="checkbox" id="selectAll" /> Select all</label>
    <input type="search" id="searchInput" placeholder="Filter files…" />
    <button type="button" id="extractSelBtn">Extract selected</button>
    <button type="button" id="extractAllBtn" class="primary">Extract all</button>
  </div>

  <div id="tree"></div>
</div>

<div id="previewModal">
  <div class="inner">
    <div class="row" style="justify-content:space-between;">
      <strong id="previewTitle"></strong>
      <button type="button" id="previewClose">Close</button>
    </div>
    <div id="previewBody"></div>
  </div>
</div>

<script src="/apps/extract/vendor/zip-fs.min.js"></script>
<script type="module" src="/apps/extract/vendor/libarchive-loader.js"></script>
<script src="/apps/extract/common.js"></script>
<script src="/apps/extract/extractor.js"></script>
</body>
</html>
